name: Windows build

on:
  push:
    branches: [dev, main]
    tags: ['v*']
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and test
        shell: powershell
        run: |
          python -m pip install -r requirements.txt pyinstaller
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m compileall -q .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m unittest discover -s tests -v
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build executable
        shell: powershell
        run: |
          python bike_icon.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name ZwiftController --icon bike.ico --collect-submodules bleak --collect-submodules zeroconf --hidden-import pystray._win32 desktop.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash -LiteralPath 'dist\ZwiftController.exe' -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content -LiteralPath 'dist\ZwiftController.exe.sha256' -Value "$hash  ZwiftController.exe" -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: ZwiftController-Windows-${{ github.sha }}
          path: |
            dist/ZwiftController.exe
            dist/ZwiftController.exe.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate stable tag and approved branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
          version=$(python3 -c 'from version import VERSION; print(VERSION)')
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [[ "$GITHUB_REF_NAME" == "v$version" ]]
      - uses: actions/download-artifact@v4
        with:
          name: ZwiftController-Windows-${{ github.sha }}
          path: dist
      - name: Verify and publish approved release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          (cd dist && tr -d '\r' < ZwiftController.exe.sha256 | sha256sum --check -)
          gh release create "$GITHUB_REF_NAME" dist/ZwiftController.exe dist/ZwiftController.exe.sha256 --verify-tag --generate-notes --title "Zwift Controller $GITHUB_REF_NAME"
